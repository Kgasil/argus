name: Argus Block 03 development validation
on:
  push:
    branches:
      - development/argus-block-03-ai-security
    paths:
      - 'development/**'
      - 'extension/**'
      - 'tests/**'
      - 'downloads/**'
      - '.github/workflows/argus-block-03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - run: node --check development/block-02/privacy.js
      - run: node --check development/block-03/review.js
      - run: node tests/mini.test.js
      - run: python3 tests/verify_mini_package.py
      - run: node development/block-02/privacy.test.js
      - run: node development/block-03/review.test.js
