name: Argus Block 09.6 development validation
on:
  push:
    branches:
      - development/argus-block-09-6-conditional-acceptance
    paths:
      - 'development/**'
      - 'extension/**'
      - 'tests/**'
      - 'downloads/**'
      - '.github/workflows/argus-block-09-6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; observed in CI 46074298790
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; observed in CI 46074298790
        with:
          node-version: '22'
      - run: node tests/mini.test.js
      - run: python3 tests/verify_mini_package.py
      - run: node development/block-02/privacy.test.js
      - run: node development/block-03/review.test.js
      - run: node development/block-04/assurance.test.js
      - run: node development/block-05/session.test.js
      - run: node --check development/block-06/extension/ui.js
      - run: node development/block-06/extension.test.js
      - run: google-chrome --version
      - run: node development/block-06/browser.test.js
      - run: node --check development/block-07/lab.js
      - run: node --check development/block-07/mini/ui.js
      - run: node development/block-07/lab.test.js
      - run: node development/block-07/browser.test.js
      - run: node development/block-08/design.test.js
      - run: node development/block-08/browser.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; observed in CI 46074298790
        with:
          name: argus-design-evidence
          path: argus-design-evidence/*.png
          if-no-files-found: error
          retention-days: 7
      - run: node development/block-09/benchmark.test.js
      - run: node development/block-09/performance.test.js
      - run: node development/block-09/privacy-browser.test.js
      - run: node development/block-09-2/refinement.test.js
      - run: node development/block-09-3/exact.test.js
      - run: node development/block-09-5/structural.test.js
      - run: node development/block-09-6/acceptance.test.js
      - run: node development/block-09-6/evaluator.test.js
      - run: echo "ARGUS_NATIVE_DEFERRED prior environment blocked; physical protocol required"
