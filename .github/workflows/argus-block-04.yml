name: Argus Block 04 development validation
on:
  push:
    branches:
      - development/argus-block-04-ai-assurance
    paths:
      - 'development/**'
      - 'extension/**'
      - 'tests/**'
      - 'downloads/**'
      - '.github/workflows/argus-block-04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; observed in CI 46074298790
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; observed in CI 46074298790
        with:
          node-version: '22'
      - run: node --version
      - run: node --check development/block-02/privacy.js
      - run: node --check development/block-03/review.js
      - run: node --check development/block-04/assurance.js
      - run: node tests/mini.test.js
      - run: python3 tests/verify_mini_package.py
      - run: node development/block-02/privacy.test.js
      - run: node development/block-03/review.test.js
      - run: node development/block-04/assurance.test.js
