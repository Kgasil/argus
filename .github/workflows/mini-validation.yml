name: Argus Mini validation
on:
  push:
    paths:
      - 'extension/**'
      - 'mini/**'
      - 'tests/mini.test.js'
      - 'tests/verify_mini_package.py'
      - 'downloads/Argus-Mini-v0.1.0-install.zip'
      - 'downloads/SHA256SUMS.txt'
      - '.github/workflows/mini-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; observed in CI 46074298790
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; observed in CI 46074298790
        with:
          node-version: '22'
      - run: python3 tests/verify_mini_package.py
      - run: node --check extension/core.js
      - run: node --check extension/ui.js
      - run: node tests/mini.test.js
